      - "第 22 章 FCN 与编码器—解码器架构": chapters/ch22.md
      - "第 23 章 U-Net：跳跃连接、特征拼接与场景选择": chapters/ch23.md
      - "第 24 章 Mask R-CNN：实例分割、ROI Align 与多任务损失": chapters/ch24.md
