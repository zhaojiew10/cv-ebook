      - "第 28 章 GAN 与 DCGAN：对抗训练和稳定实现": chapters/ch28.md
      - "第 29 章 WGAN、StyleGAN 与 CycleGAN": chapters/ch29.md
      - "第 30 章 Vision Transformer：范式、架构与全局建模": chapters/ch30.md
