<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">过拟合、良好拟合与欠拟合的训练和验证损失曲线</title>
  <desc id="desc">三组示意图使用相同的训练轮次横轴和损失纵轴，蓝线表示训练损失，橙线表示验证损失。过拟合时验证损失先降后升并与训练损失分离；良好拟合时两线总体共同下降且末期较低、差距合理；欠拟合时两线都停在较高水平。每个面板附有简短判读。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif; fill: #0f172a; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .panel-title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .axis { fill: none; stroke: #475569; stroke-width: 2; }
      .grid { stroke: #e2e8f0; stroke-width: 1.5; }
      .train { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .valid { fill: none; stroke: #d97706; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .tick { font-size: 16px; fill: #475569; }
      .note { font-size: 17px; fill: #475569; }
      .reading { font-size: 17px; font-weight: 700; }
    </style>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="32" y="48" font-size="32" font-weight="700">训练—验证损失曲线：同时看趋势、绝对水平与两集差距</text>
  <text x="32" y="82" font-size="19" fill="#475569">示意图，不对应具体实验数值；短期波动应放入连续若干轮的趋势中判断</text>
  <g aria-label="图例">
    <line x1="824" y1="75" x2="864" y2="75" class="train"/>
    <text x="874" y="82" font-size="18">训练损失</text>
    <line x1="994" y1="75" x2="1034" y2="75" class="valid"/>
    <text x="1044" y="82" font-size="18">验证损失</text>
  </g>

  <!-- 过拟合 -->
  <rect class="panel" x="32" y="116" width="360" height="536" rx="16"/>
  <rect x="32" y="116" width="360" height="7" rx="3.5" fill="#dc2626"/>
  <text class="panel-title" x="56" y="158">① 过拟合｜高方差</text>
  <text class="subtitle" x="56" y="185">训练表现继续改善，验证后期恶化</text>
  <text class="tick" x="62" y="220">损失 ↑</text>
  <g class="grid">
    <line x1="92" y1="242" x2="356" y2="242"/>
    <line x1="92" y1="292" x2="356" y2="292"/>
    <line x1="92" y1="342" x2="356" y2="342"/>
    <line x1="92" y1="392" x2="356" y2="392"/>
  </g>
  <path class="axis" d="M 92 222 V 438 H 364" marker-end="url(#axis-arrow)"/>
  <text class="tick" x="72" y="247">高</text>
  <text class="tick" x="72" y="431">低</text>
  <text class="tick" x="92" y="461" text-anchor="middle">初期</text>
  <text class="tick" x="350" y="461" text-anchor="middle">后期</text>
  <text class="subtitle" x="224" y="486" text-anchor="middle">训练轮次 →</text>
  <path class="train" d="M 104 250 C 136 270, 148 310, 176 340 S 232 390, 260 405 S 318 418, 348 422"/>
  <path class="valid" d="M 104 258 C 138 278, 154 320, 184 344 S 222 360, 242 352 C 270 342, 282 310, 306 290 S 334 275, 348 268"/>
  <line x1="242" y1="228" x2="242" y2="438" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="176" y="214" width="132" height="26" rx="7" fill="#fef2f2"/>
  <text x="242" y="233" text-anchor="middle" font-size="16" fill="#dc2626">验证损失拐点</text>
  <circle cx="242" cy="352" r="6" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <rect x="52" y="510" width="320" height="118" rx="12" fill="#fef2f2"/>
  <text class="reading" x="68" y="541" fill="#b91c1c">信号：训练损失↓，验证损失先降后升</text>
  <text class="note" x="68" y="574">两线间隙扩大，后期更新偏向记忆。</text>
  <text class="note" x="68" y="603">判读：控制容量，适度增强并早停。</text>

  <!-- 良好拟合 -->
  <rect class="panel" x="420" y="116" width="360" height="536" rx="16"/>
  <rect x="420" y="116" width="360" height="7" rx="3.5" fill="#16a34a"/>
  <text class="panel-title" x="444" y="158">② 良好拟合｜差距合理</text>
  <text class="subtitle" x="444" y="185">两集总体共同改善，末期都保持较低损失</text>
  <text class="tick" x="450" y="220">损失 ↑</text>
  <g class="grid">
    <line x1="480" y1="242" x2="744" y2="242"/>
    <line x1="480" y1="292" x2="744" y2="292"/>
    <line x1="480" y1="342" x2="744" y2="342"/>
    <line x1="480" y1="392" x2="744" y2="392"/>
  </g>
  <path class="axis" d="M 480 222 V 438 H 752" marker-end="url(#axis-arrow)"/>
  <text class="tick" x="460" y="247">高</text>
  <text class="tick" x="460" y="431">低</text>
  <text class="tick" x="480" y="461" text-anchor="middle">初期</text>
  <text class="tick" x="738" y="461" text-anchor="middle">后期</text>
  <text class="subtitle" x="612" y="486" text-anchor="middle">训练轮次 →</text>
  <path class="train" d="M 492 250 C 524 270, 544 306, 572 336 S 626 379, 656 396 S 710 411, 736 414"/>
  <path class="valid" d="M 492 258 C 524 278, 548 306, 576 330 S 624 364, 652 378 C 676 388, 688 386, 704 394 S 724 398, 736 398"/>
  <rect x="592" y="298" width="152" height="30" rx="8" fill="#f0fdf4"/>
  <text x="668" y="319" text-anchor="middle" font-size="16" fill="#15803d">末期低且较接近</text>
  <rect x="440" y="510" width="320" height="118" rx="12" fill="#f0fdf4"/>
  <text class="reading" x="456" y="541" fill="#15803d">信号：两线总体同降，差距保持合理</text>
  <text class="note" x="456" y="574">没有持续分裂，验证趋势未明显反转。</text>
  <text class="note" x="456" y="603">判读：仍须核对任务指标与部署数据。</text>

  <!-- 欠拟合 -->
  <rect class="panel" x="808" y="116" width="360" height="536" rx="16"/>
  <rect x="808" y="116" width="360" height="7" rx="3.5" fill="#7c3aed"/>
  <text class="panel-title" x="832" y="158">③ 欠拟合｜高偏差</text>
  <text class="subtitle" x="832" y="185">两集都未学好，较小间隙不代表泛化好</text>
  <text class="tick" x="838" y="220">损失 ↑</text>
  <g class="grid">
    <line x1="868" y1="242" x2="1132" y2="242"/>
    <line x1="868" y1="292" x2="1132" y2="292"/>
    <line x1="868" y1="342" x2="1132" y2="342"/>
    <line x1="868" y1="392" x2="1132" y2="392"/>
  </g>
  <path class="axis" d="M 868 222 V 438 H 1140" marker-end="url(#axis-arrow)"/>
  <text class="tick" x="848" y="247">高</text>
  <text class="tick" x="848" y="431">低</text>
  <text class="tick" x="868" y="461" text-anchor="middle">初期</text>
  <text class="tick" x="1126" y="461" text-anchor="middle">后期</text>
  <text class="subtitle" x="1000" y="486" text-anchor="middle">训练轮次 →</text>
  <path class="train" d="M 880 250 C 910 264, 928 279, 956 291 S 1000 303, 1032 306 C 1064 309, 1096 308, 1124 309"/>
  <path class="valid" d="M 880 258 C 912 270, 934 280, 960 288 S 1004 296, 1036 299 C 1068 301, 1098 300, 1124 301"/>
  <rect x="942" y="332" width="196" height="52" rx="9" fill="#f5f3ff"/>
  <text x="1040" y="354" text-anchor="middle" font-size="16" fill="#6d28d9">两线较早进入高位平台</text>
  <text x="1040" y="376" text-anchor="middle" font-size="16" fill="#6d28d9">间隙小，但损失仍高</text>
  <rect x="828" y="510" width="320" height="118" rx="12" fill="#f5f3ff"/>
  <text class="reading" x="844" y="541" fill="#6d28d9">信号：训练与验证损失都停在较高水平</text>
  <text class="note" x="844" y="574">先区分容量、训练不足与约束过强。</text>
  <text x="844" y="603" class="note">判读：充分训练，再调能力与约束。</text>
</svg>
