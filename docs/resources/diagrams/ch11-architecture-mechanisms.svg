<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">四种 CNN 架构的核心机制对比</title>
  <desc id="desc">四个面板分别展示 ResNet 的恒等捷径与残差相加、Inception 的并行多尺度分支与通道拼接、DenseNet 对全部历史特征的密集拼接，以及 EfficientNet 用复合系数联动深度、宽度和输入分辨率。图中标明数据流方向、关键运算和形状或资源约束。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif; fill: #0f172a; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .panel-title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .label { font-size: 18px; }
      .small { font-size: 16px; fill: #475569; }
      .formula { font-size: 19px; font-weight: 700; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .flow-gray { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow-gray); }
      .flow-purple { fill: none; stroke: #7c3aed; stroke-width: 2.2; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="32" y="50" font-size="32" font-weight="700">四种 CNN 架构：不是更复杂，而是用不同机制组织特征</text>
  <text x="32" y="84" font-size="19" fill="#475569">相加保留恒等通路｜并行覆盖多尺度｜拼接复用历史特征｜复合缩放协调三种资源轴</text>

  <!-- ResNet：残差相加 -->
  <rect class="panel" x="32" y="116" width="560" height="286" rx="16"/>
  <rect x="32" y="116" width="8" height="286" rx="4" fill="#2563eb"/>
  <text class="panel-title" x="56" y="154">ResNet｜残差相加</text>
  <text class="subtitle" x="56" y="182">恒等捷径同时保留信息与直接梯度通路</text>
  <rect x="64" y="236" width="72" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="formula" x="100" y="267" text-anchor="middle">x</text>
  <rect x="216" y="196" width="116" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="274" y="218" text-anchor="middle">卷积分支</text>
  <text class="label" x="274" y="241" text-anchor="middle">F(x)</text>
  <circle cx="392" cy="260" r="25" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="392" y="269" text-anchor="middle" font-size="28" font-weight="700" fill="#2563eb">+</text>
  <rect x="458" y="236" width="94" height="48" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="formula" x="505" y="267" text-anchor="middle">y</text>
  <path class="flow" d="M 136 260 H 166 V 223 H 210"/>
  <path class="flow" d="M 332 223 H 352 V 260 H 362"/>
  <path class="flow-gray" d="M 166 260 V 318 H 392 V 291"/>
  <path class="flow" d="M 417 260 H 452"/>
  <circle cx="166" cy="260" r="4" fill="#475569"/>
  <text class="small" x="246" y="343" text-anchor="middle">恒等路径：x 原样传递</text>
  <rect x="56" y="358" width="512" height="30" rx="8" fill="#eff6ff"/>
  <text class="formula" x="312" y="379" text-anchor="middle" fill="#1d4ed8">y = F(x) + x　｜　相加前两边形状必须一致</text>

  <!-- Inception：并行多尺度 -->
  <rect class="panel" x="608" y="116" width="560" height="286" rx="16"/>
  <rect x="608" y="116" width="8" height="286" rx="4" fill="#0f766e"/>
  <text class="panel-title" x="632" y="154">Inception｜并行多尺度</text>
  <text class="subtitle" x="632" y="182">昂贵卷积前用 1×1 降维，四路输出按通道拼接</text>
  <rect x="632" y="238" width="76" height="48" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text class="label" x="670" y="268" text-anchor="middle">输入</text>
  <circle cx="738" cy="262" r="4" fill="#0f766e"/>
  <path class="flow-gray" d="M 708 262 H 734"/>
  <g fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8">
    <rect x="778" y="190" width="146" height="30" rx="7"/>
    <rect x="778" y="229" width="146" height="30" rx="7"/>
    <rect x="778" y="268" width="146" height="30" rx="7"/>
    <rect x="778" y="307" width="146" height="30" rx="7"/>
  </g>
  <g font-size="16" text-anchor="middle">
    <text x="851" y="211">1×1 卷积</text>
    <text x="851" y="250">1×1 → 3×3</text>
    <text x="851" y="289">1×1 → 5×5</text>
    <text x="851" y="328">池化 → 1×1</text>
  </g>
  <g fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-gray)">
    <path d="M 738 262 H 754 V 205 H 772"/>
    <path d="M 754 244 H 772"/>
    <path d="M 754 283 H 772"/>
    <path d="M 738 262 H 754 V 322 H 772"/>
  </g>
  <g fill="none" stroke="#0f766e" stroke-width="1.8">
    <path d="M 924 205 H 954 V 250 H 982"/>
    <path d="M 924 244 H 982"/>
    <path d="M 924 283 H 954 V 274 H 982"/>
    <path d="M 924 322 H 966 V 274 H 982"/>
  </g>
  <rect x="988" y="238" width="144" height="48" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text class="label" x="1060" y="268" text-anchor="middle">通道拼接</text>
  <text class="small" x="1060" y="314" text-anchor="middle">联合局部与较大范围特征</text>
  <rect x="632" y="358" width="512" height="30" rx="8" fill="#f0fdfa"/>
  <text class="formula" x="888" y="379" text-anchor="middle" fill="#0f766e">并行提取，而非串行堆叠四种运算</text>

  <!-- DenseNet：密集拼接 -->
  <rect class="panel" x="32" y="422" width="560" height="306" rx="16"/>
  <rect x="32" y="422" width="8" height="306" rx="4" fill="#7c3aed"/>
  <text class="panel-title" x="56" y="460">DenseNet｜历史特征拼接</text>
  <text class="subtitle" x="56" y="488">dense block 内，每层都能直接接收全部前层输出</text>
  <g fill="#f5f3ff" stroke="#7c3aed" stroke-width="2">
    <rect x="62" y="566" width="76" height="48" rx="10"/>
    <rect x="190" y="566" width="84" height="48" rx="10"/>
    <rect x="326" y="566" width="84" height="48" rx="10"/>
    <rect x="462" y="566" width="84" height="48" rx="10"/>
  </g>
  <g class="formula" text-anchor="middle" fill="#7c3aed">
    <text x="100" y="597">x₀</text>
    <text x="232" y="597">H₁</text>
    <text x="368" y="597">H₂</text>
    <text x="504" y="597">H₃</text>
  </g>
  <path class="flow-purple" d="M 138 590 H 184"/>
  <path class="flow-purple" d="M 274 590 H 320"/>
  <path class="flow-purple" d="M 410 590 H 456"/>
  <path class="flow-purple" d="M 100 566 V 536 Q 100 522 114 522 H 354 Q 368 522 368 536 V 560"/>
  <path class="flow-purple" d="M 100 536 Q 100 506 124 506 H 480 Q 504 506 504 530 V 560"/>
  <path class="flow-purple" d="M 232 566 V 550 Q 232 540 246 540 H 490 Q 504 540 504 554 V 560"/>
  <text class="small" x="302" y="640" text-anchor="middle">箭头表示前层特征汇入；方括号 [ ] 表示沿通道维拼接</text>
  <rect x="56" y="654" width="512" height="56" rx="10" fill="#f5f3ff"/>
  <text class="formula" x="312" y="679" text-anchor="middle" fill="#6d28d9">xℓ = Hℓ([x₀, x₁, …, xℓ₋₁])</text>
  <text class="small" x="312" y="701" text-anchor="middle">复用与短梯度通路增强；输入通道和显存也持续增长</text>

  <!-- EfficientNet：复合缩放 -->
  <rect class="panel" x="608" y="422" width="560" height="306" rx="16"/>
  <rect x="608" y="422" width="8" height="306" rx="4" fill="#d97706"/>
  <text class="panel-title" x="632" y="460">EfficientNet｜三轴复合缩放</text>
  <text class="subtitle" x="632" y="488">固定比例，用单一系数 φ 联动扩模</text>
  <rect x="632" y="520" width="156" height="68" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text class="label" x="710" y="547" text-anchor="middle">深度：层数</text>
  <text class="formula" x="710" y="574" text-anchor="middle" fill="#b45309">d = α^φ</text>
  <rect x="988" y="520" width="156" height="68" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text class="label" x="1066" y="547" text-anchor="middle">宽度：通道数</text>
  <text class="formula" x="1066" y="574" text-anchor="middle" fill="#b45309">w = β^φ</text>
  <circle cx="888" cy="574" r="38" fill="#ffedd5" stroke="#d97706" stroke-width="2.5"/>
  <text x="888" y="584" text-anchor="middle" font-size="30" font-weight="700" fill="#b45309">φ</text>
  <path d="M 850 574 H 794" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <path d="M 926 574 H 982" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <path d="M 888 612 V 626" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <rect x="810" y="632" width="156" height="54" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text class="label" x="888" y="654" text-anchor="middle">分辨率：输入尺寸</text>
  <text class="formula" x="888" y="678" text-anchor="middle" fill="#b45309">r = γ^φ</text>
  <text class="small" x="632" y="620">不是只加深</text>
  <text class="small" x="1052" y="620">不是只加宽</text>
  <text class="formula" x="888" y="711" text-anchor="middle" fill="#b45309">约束：αβ²γ² ≈ 2　｜　按预算协调三轴</text>
</svg>
