<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">匈牙利匹配：预测槽位与真实目标的一对一最优分配</title>
  <desc id="desc">五行三列的示意代价矩阵连接预测槽位与猫、狗、人三个真实目标。绿色单元给出总代价最小的一对一分配：猫匹配预测 q3，狗匹配 q2，人匹配 q1；未匹配的 q4 和 q5 学习 no object。底部说明这种训练标签分配不同于推理阶段的 NMS。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .selected { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3; }
      .section-title { font-size: 24px; font-weight: 700; }
      .body { font-size: 19px; }
      .note { font-size: 16px; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="40" y="52" font-size="32" font-weight="700">匈牙利匹配：从代价矩阵到一对一集合监督</text>
  <text x="40" y="84" font-size="18" class="muted">固定预测槽位与真实目标进行全局最优分配；绿色路径表示训练时的监督关系</text>

  <rect x="40" y="110" width="700" height="500" rx="16" class="panel"/>
  <text x="64" y="145" class="section-title">① 构造预测—真实目标代价矩阵</text>
  <text x="64" y="174" font-size="17" class="muted">每格 Cᵢⱼ：类别 + L1 + GIoU；数值越小越合适</text>
  <text x="421" y="204" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">真实目标（列）</text>
  <text x="112" y="204" text-anchor="middle" font-size="17" font-weight="700" class="muted">预测槽位（行）</text>

  <rect x="172" y="218" width="166" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="338" y="218" width="166" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="504" y="218" width="166" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="255" y="247" text-anchor="middle" class="body" font-weight="700">真实 1：猫</text>
  <text x="421" y="247" text-anchor="middle" class="body" font-weight="700">真实 2：狗</text>
  <text x="587" y="247" text-anchor="middle" class="body" font-weight="700">真实 3：人</text>

  <rect x="64" y="276" width="96" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="64" y="332" width="96" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="64" y="388" width="96" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="64" y="444" width="96" height="56" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="64" y="500" width="96" height="56" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="112" y="311" text-anchor="middle" class="body" font-weight="700">预测 q1</text>
  <text x="112" y="367" text-anchor="middle" class="body" font-weight="700">预测 q2</text>
  <text x="112" y="423" text-anchor="middle" class="body" font-weight="700">预测 q3</text>
  <text x="112" y="479" text-anchor="middle" class="body" font-weight="700">预测 q4</text>
  <text x="112" y="535" text-anchor="middle" class="body" font-weight="700">预测 q5</text>

  <rect x="172" y="276" width="166" height="56" class="cell"/>
  <rect x="338" y="276" width="166" height="56" class="cell"/>
  <rect x="504" y="276" width="166" height="56" class="selected"/>
  <rect x="172" y="332" width="166" height="56" class="cell"/>
  <rect x="338" y="332" width="166" height="56" class="selected"/>
  <rect x="504" y="332" width="166" height="56" class="cell"/>
  <rect x="172" y="388" width="166" height="56" class="selected"/>
  <rect x="338" y="388" width="166" height="56" class="cell"/>
  <rect x="504" y="388" width="166" height="56" class="cell"/>
  <rect x="172" y="444" width="166" height="56" class="cell"/>
  <rect x="338" y="444" width="166" height="56" class="cell"/>
  <rect x="504" y="444" width="166" height="56" class="cell"/>
  <rect x="172" y="500" width="166" height="56" class="cell"/>
  <rect x="338" y="500" width="166" height="56" class="cell"/>
  <rect x="504" y="500" width="166" height="56" class="cell"/>

  <text x="255" y="311" text-anchor="middle" font-size="21">5.2</text>
  <text x="421" y="311" text-anchor="middle" font-size="21">5.6</text>
  <text x="577" y="311" text-anchor="middle" font-size="21" font-weight="700" fill="#15803d">0.7</text>
  <circle cx="648" cy="293" r="11" fill="#16a34a"/>
  <path d="M 642 293 L 646 297 L 654 288" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="255" y="367" text-anchor="middle" font-size="21">0.4</text>
  <text x="411" y="367" text-anchor="middle" font-size="21" font-weight="700" fill="#15803d">0.9</text>
  <text x="587" y="367" text-anchor="middle" font-size="21">4.2</text>
  <circle cx="482" cy="349" r="11" fill="#16a34a"/>
  <path d="M 476 349 L 480 353 L 488 344" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="245" y="423" text-anchor="middle" font-size="21" font-weight="700" fill="#15803d">0.5</text>
  <text x="421" y="423" text-anchor="middle" font-size="21">1.3</text>
  <text x="587" y="423" text-anchor="middle" font-size="21">1.0</text>
  <circle cx="316" cy="405" r="11" fill="#16a34a"/>
  <path d="M 310 405 L 314 409 L 322 400" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="255" y="479" text-anchor="middle" font-size="21">4.4</text>
  <text x="421" y="479" text-anchor="middle" font-size="21">1.1</text>
  <text x="587" y="479" text-anchor="middle" font-size="21">4.7</text>
  <text x="255" y="535" text-anchor="middle" font-size="21">3.5</text>
  <text x="421" y="535" text-anchor="middle" font-size="21">3.2</text>
  <text x="587" y="535" text-anchor="middle" font-size="21">2.6</text>

  <rect x="64" y="575" width="16" height="16" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="90" y="589" class="note" fill="#15803d">全局最优选中项</text>
  <text x="238" y="589" class="note muted">单格最小值仍须服从每行、每列的唯一性约束</text>

  <line x1="748" y1="355" x2="780" y2="355" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="764" y="334" text-anchor="middle" class="note" font-weight="700" fill="#2563eb">求解</text>

  <rect x="790" y="110" width="370" height="500" rx="16" class="panel"/>
  <text x="814" y="145" class="section-title">② 一对一分配结果</text>
  <text x="814" y="176" font-size="18" class="muted">最小总代价：0.5 + 0.9 + 0.7 = 2.1</text>

  <rect x="814" y="205" width="322" height="64" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="836" y="244" class="body" font-weight="700">真实：猫</text>
  <line x1="946" y1="237" x2="995" y2="237" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1010" y="231" font-size="21" font-weight="700" fill="#15803d">预测 q3</text>
  <text x="1010" y="254" class="note muted">代价 0.5</text>

  <rect x="814" y="287" width="322" height="64" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="836" y="326" class="body" font-weight="700">真实：狗</text>
  <line x1="946" y1="319" x2="995" y2="319" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1010" y="313" font-size="21" font-weight="700" fill="#15803d">预测 q2</text>
  <text x="1010" y="336" class="note muted">代价 0.9</text>

  <rect x="814" y="369" width="322" height="64" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="836" y="408" class="body" font-weight="700">真实：人</text>
  <line x1="946" y1="401" x2="995" y2="401" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1010" y="395" font-size="21" font-weight="700" fill="#15803d">预测 q1</text>
  <text x="1010" y="418" class="note muted">代价 0.7</text>

  <rect x="814" y="454" width="322" height="98" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="836" y="481" font-size="19" font-weight="700" fill="#d97706">未匹配预测槽位</text>
  <text x="836" y="511" font-size="21" font-weight="700" fill="#d97706">q4、q5 → no object</text>
  <text x="836" y="539" class="note muted">仅接受无物体分类监督</text>

  <circle cx="827" cy="578" r="10" fill="#16a34a"/>
  <path d="M 822 578 L 826 582 L 833 573" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="846" y="585" font-size="20" font-weight="700" fill="#15803d">每个真实目标仅匹配一个预测</text>

  <rect x="40" y="632" width="1120" height="104" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="40" y="632" width="7" height="104" rx="3" fill="#16a34a"/>
  <text x="66" y="664" font-size="20" font-weight="700" fill="#15803d">训练监督：匈牙利匹配</text>
  <text x="66" y="693" font-size="18" class="muted">用真实框分配一对一责任，再计算集合损失。</text>
  <text x="66" y="718" font-size="18" class="muted">重复预测不会同时获得同一目标的正样本奖励。</text>
  <line x1="586" y1="650" x2="586" y2="718" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="606" y="632" width="7" height="104" rx="3" fill="#d97706"/>
  <text x="632" y="664" font-size="20" font-weight="700" fill="#d97706">不同于 NMS：不是推理后的去重</text>
  <text x="632" y="693" font-size="18" class="muted">NMS 按得分与 IoU 删除重复框，不使用真实框。</text>
  <text x="632" y="718" font-size="18" class="muted">匈牙利匹配仅用于训练；DETR 推理不做该匹配，也不靠 NMS。</text>
</svg>
